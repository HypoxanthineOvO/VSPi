workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - quality
  - test
  - package
  - install
  - release

default:
  image:
    name: gitlab.vsplab.cn:5050/heyx/vspi/ci-node:22.22.0-3@sha256:851dd7ad97ef3937761bdff450e349c08ac5d173e9b7ecc1bb01ca875c40f491
  tags:
    - vspi-docker
  interruptible: true
  before_script:
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund

variables:
  npm_config_cache: "/cache/vspi/npm"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_retry_mintimeout: "10000"

quality:
  stage: quality
  script:
    - npm run check

test:
  stage: test
  needs: []
  script:
    - npm test -- --maxWorkers=4

package:
  stage: package
  script:
    - mkdir -p .artifacts
    - npm pack --json --pack-destination .artifacts > .artifacts/pack.json
    - node scripts/ci/verify-package.mjs .artifacts/pack.json
    - sha256sum ".artifacts/vspi-$(node -p "require('./package.json').version").tgz" > .artifacts/SHA256SUMS
  artifacts:
    name: "vspi-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    when: on_success
    paths:
      - .artifacts/
    expire_in: 1 week

install-smoke:
  stage: install
  needs:
    - job: package
      artifacts: true
  script:
    - export VERSION="$(node -p "require('./package.json').version")"
    - export TARBALL="$CI_PROJECT_DIR/.artifacts/vspi-${VERSION}.tgz"
    - cd "$(mktemp -d)"
    - npm install --prefix install-root --omit=dev --no-audit --no-fund "$TARBALL"
    - test "$(install-root/node_modules/.bin/vspi --version)" = "$VERSION"

release:
  stage: release
  interruptible: false
  needs:
    - job: package
      artifacts: true
    - job: install-smoke
  before_script:
    - node --version
  script:
    - export VERSION="$(node -p "require('./package.json').version")"
    - export FILENAME="vspi-${VERSION}.tgz"
    - export PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vspi/$VERSION/$FILENAME"
    - export LATEST_PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vspi/$VERSION/vspi-latest.tgz"
    - export RELEASE_TITLE="VSPi $VERSION - Fullscreen Runtime"
    - export RELEASE_NOTES_PATH="Docs/releases/v$VERSION.md"
    - node scripts/ci/publish-release.mjs .artifacts/SHA256SUMS ".artifacts/$FILENAME"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/'
    - when: never
