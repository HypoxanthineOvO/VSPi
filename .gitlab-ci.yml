stages:
  - test
  - release

default:
  tags:
    - vspi-docker

gitlab-release-contract:
  stage: test
  image: node:24.15.0
  script:
    - node --check scripts/github-release-producer.mjs
    - node --check scripts/gitlab-release-producer.mjs
    - node --check scripts/gitlab-release-producer.test.mjs
    - node --test scripts/gitlab-release-producer.test.mjs

vspi-quality:
  stage: test
  image: node:24.15.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - sed -i 's|http://deb.debian.org|https://deb.debian.org|g' /etc/apt/sources.list.d/debian.sources
    - apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
    - apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends zip
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm check:vspi

mirror-vspi-release:
  stage: release
  image: node:24.15.0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    GITHUB_RELEASE_BASE_URL: https://github.com/HypoxanthineOvO/VSPi/releases/download
    GITHUB_REF_NAME: $CI_COMMIT_TAG
    GITLAB_API_URL: $CI_API_V4_URL
    GITLAB_PROJECT_ID: $CI_PROJECT_ID
    GITLAB_PROJECT_URL: $CI_PROJECT_URL
  script:
    - node scripts/gitlab-release-producer.mjs vspi-release-metadata.json
  artifacts:
    paths:
      - vspi-release-metadata.json
