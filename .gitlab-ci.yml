workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  interruptible: true
  tags:
    - latex-runner
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node-v22.22.3-linux-x64/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_retry_mintimeout: "10000"
  NODE_ARCHIVE_SHA256: "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f"
  NODE_VERSION: "22.22.3"

stages:
  - verify

verify:
  stage: verify
  before_script:
    - |
      set -eu
      NODE_ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
      NODE_HOME="$CI_PROJECT_DIR/node-v${NODE_VERSION}-linux-x64"
      if [ ! -x "$NODE_HOME/bin/node" ]; then
        curl --proto '=https' --tlsv1.2 -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}"
        echo "${NODE_ARCHIVE_SHA256}  ${NODE_ARCHIVE}" | sha256sum -c -
        tar -xJf "$NODE_ARCHIVE"
        rm "$NODE_ARCHIVE"
      fi
      export PATH="$NODE_HOME/bin:$PATH"
      node --version
      npm --version
    - |
      for attempt in 1 2 3; do
        if npm ci --ignore-scripts --no-audit --no-fund; then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        echo "npm ci failed on attempt ${attempt}; retrying"
        sleep 10
      done
  script:
    - npm run check
    - npm test -- --maxWorkers=4
    - git diff --check
    - test "$(node dist/index.js --version)" = "$(node -p "require('./package.json').version")"
    - npm pack
    - export TARBALL="vspi-$(node -p "require('./package.json').version").tgz"
    - test -f "$TARBALL"
    - mkdir .package-smoke
    - npm install --prefix .package-smoke --ignore-scripts --no-audit --no-fund "./$TARBALL"
    - test "$(.package-smoke/node_modules/.bin/vspi --version)" = "$(node -p "require('./package.json').version")"
  artifacts:
    when: on_success
    paths:
      - vspi-*.tgz
    expire_in: 1 week
