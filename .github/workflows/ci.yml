name: Fast checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Fast syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check release scripts and manifests
        run: |
          node --check scripts/github-release-producer.mjs
          node --check scripts/vspi-release-identity.mjs
          node --check apps/vspi/scripts/stage-package.mjs
          node --check apps/vspi/scripts/verify-package.mjs
          node -e 'for (const f of ["package.json", "apps/vspi/package.json"]) JSON.parse(require("fs").readFileSync(f))'
