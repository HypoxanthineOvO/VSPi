server {
    listen 443 ssl;
    server_name __INTERNAL_HOST__;
    ssl_certificate /etc/vsp-feedback/tls/fullchain.pem;
    ssl_certificate_key /etc/vsp-feedback/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;
    root /srv/vsp-downloads;
    location = /vspi/latest.json {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /vspi/releases/ {
        limit_except GET { deny all; }
        autoindex off;
        disable_symlinks on;
        try_files $uri =404;
    }
    location = /api/feedback {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18761;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
